[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-fractal-state-tool"
version = "0.1.0"
description = "Experimental authority probe and state workflow tool for the CUDA fractal runtime"
requires-python = ">=3.9"

[project.scripts]
cuda-fractal-runtime-probe = "cuda_fractal_state_tool.runtime_probe:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
