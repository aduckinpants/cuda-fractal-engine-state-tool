[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-fractal-state-tool"
version = "0.1.0"
description = "Experimental authority probe and state workflow tool for the CUDA fractal runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Pillow>=12.1,<13",
  "keyring>=25.7,<26",
  "openai>=2.52,<3",
]

[project.scripts]
cuda-fractal-runtime-probe = "cuda_fractal_state_tool.runtime_probe:main"
cuda-fractal-agent-bundle = "cuda_fractal_state_tool.agent_bundle_cli:main"
cuda-fractal-state-override = "cuda_fractal_state_tool.state_override_cli:main"
cuda-fractal-state-proof = "cuda_fractal_state_tool.state_override_proof_cli:main"
cuda-fractal-finding-enrichment = "cuda_fractal_state_tool.finding_enrichment_cli:main"
cuda-fractal-scalar-sweep = "cuda_fractal_state_tool.scalar_sweep_cli:main"
cuda-fractal-published-provider-integration = "cuda_fractal_state_tool.published_runtime_provider_integration:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuda_fractal_state_tool = ["*.json"]
